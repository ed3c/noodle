mode = "supervised"

[routing.defaults]
provider = "codex"
model = "gpt-5.6-sol"

# Tag-specific routing overrides. Example:
# [routing.tags.urgent]
# provider = "claude"
# model = "claude-opus-4-6"

[skills]
paths = [".agents/skills"]

[agents.claude]
path = "~/.claude"
args = ["--dangerously-skip-permissions", "--verbose"]

[agents.codex]
path = "~/.codex"
args = ["--ignore-user-config"]

[adapters.backlog]
skill = "execute"

[adapters.backlog.scripts]
sync = "go run ./adapters/noodles-github sync"
add = "go run ./adapters/noodles-github refuse"
done = "go run ./adapters/noodles-github done"
edit = "go run ./adapters/noodles-github refuse"

[runtime]
# "process" | "sprites"
default = "process"

[runtime.sprites]
# token_env = "SPRITES_TOKEN"
# base_url = ""
sprite_name = "noodle-dev"
# git_token_env = "GITHUB_TOKEN"

# [runtime.cursor]
# api_key_env = "CURSOR_API_KEY"
# base_url = ""
# repository = ""
