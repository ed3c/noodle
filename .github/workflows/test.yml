name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm --filter noodle-ui build

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Verify normalized Skill tree pins
        run: go test ./skill -run '^TestTreeSHA256' -count=1 -v

      - name: Verify Skill dispatch and receipt controls
        run: go test ./dispatcher -run '^(TestRequiredSkill|TestSkillInputReceipt|TestProcessDispatcherWritesActualSelectedMethodAtOSLaunch)' -count=1 -v

      - name: Test
        run: go test ./...

      - name: Verify fixed private oracle reader without network or credentials
        run: |
          python3 -m unittest discover -s scripts -p 'test_fixed_soodles_oracle.py' -v
          python3 -m unittest discover -s scripts -p 'test_actions_runtime_coverage.py' -v

      - name: Vet
        run: go vet ./...

      - name: Lint architecture
        run: sh scripts/lint-arch.sh

      - name: Check skill snapshot
        run: |
          go run ./generate/cmd/gen-skill
          git diff --exit-code .agents/skills/noodle/SKILL.md || {
            echo "noodle skill is out of date. Run 'pnpm generate' to update."
            exit 1
          }
