name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture canonical changed source formatter output
        run: |
          pnpm --filter noodle-ui exec oxfmt --write src/client/loop-intent-rail.mjs src/client/loop-intent-rail.test.mjs src/client/loop-isometric.mjs
          for p in ui/src/client/loop-intent-rail.mjs ui/src/client/loop-intent-rail.test.mjs ui/src/client/loop-isometric.mjs; do
            echo "SOURCE_FORMAT_BEGIN:$p"
            base64 -w0 "$p"
            echo
            echo "SOURCE_FORMAT_END:$p"
          done
      - name: Verify UI source and loop interactions
        run: |
          pnpm --filter noodle-ui verify
          node --test ui/src/client/*.test.mjs
          pnpm --filter noodle-ui exec vitest run src/client/loop-graph.test.ts src/client/loop-graph-layout.test.ts src/client/loop-views.test.ts src/components/LoopGraph.test.tsx src/components/LoopViews.test.tsx src/components/Sidebar.test.tsx

      - name: Build UI
        run: pnpm --filter noodle-ui build

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Lint architecture
        run: sh scripts/lint-arch.sh

      - name: Check skill snapshot
        run: |
          go run ./generate/cmd/gen-skill
          git diff --exit-code .agents/skills/noodle/SKILL.md || {
            echo "noodle skill is out of date. Run 'pnpm generate' to update."
            exit 1
          }
