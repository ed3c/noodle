name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies from mechanically resolved TypeScript 7 lockfile
        run: pnpm install --frozen-lockfile

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Bun TypeScript 7 secondary checker and Vite-compatible runtime
        run: |
          bun --version
          bun -p process.versions.typescript
          (cd ui && bun check)
          (cd ui && bun --bun run build)
        timeout-minutes: 5

      - name: Assert native TypeScript 7 CLI and legacy compiler API are separate
        run: |
          pnpm --filter noodle-ui exec tsc --version
          pnpm --filter noodle-ui exec node -e "const ts=require('typescript'); if(!ts.version.startsWith('6.0.')) process.exit(1); console.log('Compiler JS API:',ts.version)"
          pnpm --filter noodle-ui exec node -e "const p=require('./package.json');if(p.devDependencies['@typescript/native']!=='npm:typescript@7.0.2')process.exit(1)"

      - name: Verify UI source and loop interactions
        run: |
          pnpm --filter noodle-ui verify
          node --test ui/src/client/*.test.mjs
          pnpm --filter noodle-ui exec vitest run src/client/loop-graph.test.ts src/client/loop-graph-layout.test.ts src/client/loop-views.test.ts src/components/LoopGraph.test.tsx src/components/LoopViews.test.tsx src/components/Sidebar.test.tsx

      - name: Build UI
        run: pnpm --filter noodle-ui build

      - name: Verify documentation build remains compatible with TypeScript 7 peer resolution
        run: pnpm --filter noodle-docs build

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Lint architecture
        run: sh scripts/lint-arch.sh

      - name: Check skill snapshot
        run: |
          go run ./generate/cmd/gen-skill
          git diff --exit-code .agents/skills/noodle/SKILL.md || {
            echo "noodle skill is out of date. Run 'pnpm generate' to update."
            exit 1
          }
